  <style>
    /* Comic-Schriften, lokal eingebunden (Lizenzen: assets/fonts/*-LICENSE.txt, SIL OFL).
       Comic Neue: nur der fette Schnitt, er gilt im Spiel als normale Schrift. */
    @font-face {
      font-family: 'Bangers';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/bangers-latin-400-normal.woff2') format('woff2');

      overflow: hidden;

      justify-content: center;
    }
